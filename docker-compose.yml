version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: zubeen_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_NAME: "Zubeen Player API"
      APP_ENV: local
      APP_KEY: base64:GENERATE_KEY_ONCE
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: zubeen_player
      DB_USERNAME: zubeen_user
      DB_PASSWORD: zubeen_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: public
      MEDIA_STORAGE_DISK: public
      YOUTUBE_MUSIC_SERVICE_URL: http://youtube-music:8001
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage/app
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - zubeen_network

  queue-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: zubeen_queue_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work redis --queue=default,media,analytics --tries=3 --timeout=600
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: zubeen_player
      DB_USERNAME: zubeen_user
      DB_PASSWORD: zubeen_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage/app
    depends_on:
      - backend
      - redis
    networks:
      - zubeen_network

  admin:
    build:
      context: ./admin
      dockerfile: ../docker/admin.Dockerfile
    container_name: zubeen_admin
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - zubeen_network

  youtube-music:
    build:
      context: .
      dockerfile: docker/youtube-music.Dockerfile
    container_name: zubeen_youtube_music
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      DEBUG: "false"
    ports:
      - "8001:8001"
    networks:
      - zubeen_network

  mysql:
    image: mysql:8.0
    container_name: zubeen_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zubeen_player
      MYSQL_USER: zubeen_user
      MYSQL_PASSWORD: zubeen_secure_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zubeen_network

  redis:
    image: redis:7-alpine
    container_name: zubeen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zubeen_network

volumes:
  mysql_data:
  redis_data:
  backend_storage:

networks:
  zubeen_network:
    driver: bridge
